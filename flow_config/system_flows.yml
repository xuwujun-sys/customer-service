# 【文件职责】声明任务编排所需的内部辅助 Flow，而非用户直接选择的业务能力。
# 【创建者】CommandProcessor/FlowExecutor 根据固定 ID 创建对应 SystemContext。
# 【执行优先级】只要 active_system_task 存在，FlowExecutor 就优先执行它；结束后
# 才回到底下未丢失的 active_task。
# 【关键联动】Flow ID 必须与 contexts.mapping_types、CommandProcessor 中硬编码
# 字符串一致；context.xxx 模板字段必须存在于相应 SystemContext dataclass。

flows:
  # 新业务开始确认：StartedSystemContext 提供 started_flow_name。
  system_task_started:
    description: Flow for acknowledging that a new task has started
    name: task started acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge

      - id: acknowledge
        type: action
        action: action_response
        args:
          mode: static
          text: "好的，我们先处理{{ context.started_flow_name }}。"
        next: end

      - id: end
        type: end
        next: []

  # 暂停任务恢复确认：只负责提示，结束后回到已恢复的用户 TaskContext。
  system_task_resumed:
    description: Flow for acknowledging that a paused task has been resumed
    name: task resumed acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge

      - id: acknowledge
        type: action
        action: action_response
        args:
          mode: static
          text: "好的，我们继续刚才的{{ context.resumed_flow_name }}。"
        next: end

      - id: end
        type: end
        next: []

  # 空的完成标记 Flow，目前仅提供可表达的系统状态。
  system_completed:
    description: A flow has been completed and there is nothing else to be done
    name: completion marker
    steps:
      - id: start
        type: start
        next: end

      - id: end
        type: end
        next: []

  # 系统无法处理时按 context.reason 选择话术；当前主引擎尚未接入这些分支。
  system_cannot_handle:
    description: Flow for handling requests the assistant cannot support
    name: cannot handle request
    steps:
      - id: start
        type: start
        # ConditionalLink 从上到下匹配；else 是所有未知 reason 的兜底。
        next:
          - if: "context.get('reason') == 'clarification_rejected'"
            then: clarification_rejected
          - if: "context.get('reason') == 'not_supported'"
            then: not_supported
          - if: "context.get('reason') == 'no_relevant_answer'"
            then: no_relevant_answer
          - else: ask_rephrase

      - id: clarification_rejected
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "看来我刚才理解偏了。你可以重新说一下你想查订单、查物流，还是申请退款吗？"
          prompt: |
            你是一个中文电商客服助手，语气自然、友好、简洁。
            请基于下面的建议回复，生成一句更自然的中文回复，保持原意，不要扩写。
            对话上下文：
            {history}
            用户最后一句：
            用户：{user_message}
            建议回复：{current_response}
            改写后的回复：
        next: end

      - id: not_supported
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "我理解你的意思，不过这个能力目前还没有接入。"
          prompt: |
            你是一个中文电商客服助手，语气自然、友好、简洁。
            请基于下面的建议回复，生成一句更自然的中文回复，保持原意，不要扩写。
            对话上下文：
            {history}
            用户最后一句：
            用户：{user_message}
            建议回复：{current_response}
            改写后的回复：
        next: end

      - id: no_relevant_answer
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "我暂时没有查到合适的信息。你可以换个说法，或者告诉我更具体一点的商品或订单信息。"
          prompt: |
            你是一个中文电商客服助手，语气自然、友好、简洁。
            请基于下面的建议回复，生成一句更自然的中文回复，保持原意，不要扩写。
            对话上下文：
            {history}
            用户最后一句：
            用户：{user_message}
            建议回复：{current_response}
            改写后的回复：
        next: end

      - id: ask_rephrase
        type: action
        action: action_response
        args:
          mode: rephrase
          text: "抱歉，我这边没有完全听明白。你可以再具体说一下你想处理什么电商问题吗？"
          prompt: |
            你是一个中文电商客服助手，语气自然、友好、简洁。
            请基于下面的建议回复，生成一句更自然的中文回复，保持原意，不要扩写。
            对话上下文：
            {history}
            用户最后一句：
            用户：{user_message}
            建议回复：{current_response}
            改写后的回复：
        next: end

      - id: end
        type: end
        next: []

  # 槽位收集临时任务：这是“询问后暂停本轮、下次请求继续”的核心系统 Flow。
  system_collect_information:
    description: Flow for asking the user for a slot value during a collect step
    name: collect information
    steps:
      - id: start
        type: start
        next: ask

      - id: ask
        type: action
        action: action_response
        # 字符串参数由 Executor 解析为 CollectSystemContext.response 字典。
        args: context.response
        next: listen

      - id: listen
        type: action
        # Executor 见到该名称直接结束本轮，不会真正运行 ActionListen.run。
        action: action_listen
        next: end

      - id: end
        type: end
        next: []

  # 新任务打断旧任务时的提示；底层 active_task 已切换，旧任务在 paused_tasks。
  system_task_interrupted:
    description: Flow for acknowledging that the current task has been interrupted
    name: task interrupted acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge

      - id: acknowledge
        type: action
        action: action_response
        args:
          mode: static
          text: "好的，我们先把{{ context.interrupted_flow_name }}放一放。"
        next:
          - if: "context.get('started_flow_name')"
            then: announce_started
          - else: end

      - id: announce_started
        type: action
        action: action_response
        args:
          mode: static
          text: "好的，我们先处理{{ context.started_flow_name }}。"
        next: end

      - id: end
        type: end
        next: []

  # 取消确认：CanceledSystemContext 保存被取消 Flow 的可读名称。
  system_task_canceled:
    description: Flow for acknowledging that the current task was canceled
    name: task canceled acknowledgement
    steps:
      - id: start
        type: start
        next: acknowledge

      - id: acknowledge
        type: action
        action: action_response
        args:
          mode: static
          text: "好的，{{ context.canceled_flow_name }}先帮你取消。"
        next: end

      - id: end
        type: end
        next: []
